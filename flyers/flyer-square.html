<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>QuinielaPanas Square</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .sq {
    width: 720px;
    height: 720px;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #ec4899 130%);
    color: #fff;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    padding: 36px;
    display: flex;
    flex-direction: column;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }
  .sq::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(245,158,11,0.18) 0, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(236,72,153,0.15) 0, transparent 50%);
    pointer-events: none;
  }
  .kicker {
    font-size: 13px;
    color: #fbbf24;
    letter-spacing: 5px;
    font-weight: 800;
    margin-bottom: 4px;
    z-index: 1;
  }
  .title {
    font-size: 64px;
    font-weight: 900;
    line-height: 1;
    z-index: 1;
    background: linear-gradient(90deg, #facc15, #f59e0b, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub {
    font-size: 22px;
    font-weight: 700;
    margin-top: 4px;
    z-index: 1;
  }
  .ball {
    font-size: 90px;
    margin: 18px 0;
    z-index: 1;
  }
  .row {
    display: flex;
    justify-content: center;
    gap: 14px;
    z-index: 1;
    margin-bottom: 20px;
  }
  .prize {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(251,191,36,0.4);
    border-radius: 16px;
    padding: 14px 22px;
    min-width: 130px;
  }
  .prize .med { font-size: 28px; }
  .prize .amt { font-size: 30px; font-weight: 900; color: #fbbf24; }
  .pkgs {
    background: rgba(0,0,0,0.35);
    border-radius: 16px;
    padding: 14px;
    z-index: 1;
    margin-bottom: 14px;
  }
  .pkgs .lab {
    font-size: 12px;
    letter-spacing: 3px;
    color: #fbbf24;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .pkgs .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .pkg { padding: 6px; }
  .pkg .n { font-size: 12px; opacity: 0.8; font-weight: 700; }
  .pkg .p { font-size: 24px; font-weight: 900; }
  .pkg .q { font-size: 11px; color: #cbd5e1; }
  .bottom {
    margin-top: auto;
    z-index: 1;
  }
  .cta {
    background: linear-gradient(90deg, #facc15, #f59e0b);
    color: #1a1a1a;
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 18px;
    font-weight: 900;
    display: inline-block;
    letter-spacing: 1px;
  }
  .url {
    margin-top: 14px;
    font-size: 28px;
    font-weight: 900;
  }
  .small {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.8;
  }
</style>
</head>
<body>
<div class="sq">
  <div class="kicker">★ MUNDIAL FIFA 2026 ★</div>
  <div class="title">QUINIELAPANAS</div>
  <div class="sub">Predice. Compite. Gana en Bs.</div>
  <div class="ball">⚽ 🏆</div>

  <div class="row">
    <div class="prize"><div class="med">🥇</div><div class="amt">$500</div></div>
    <div class="prize"><div class="med">🥈</div><div class="amt">$250</div></div>
    <div class="prize"><div class="med">🥉</div><div class="amt">$150</div></div>
  </div>

  <div class="pkgs">
    <div class="lab">★ Paquetes ★</div>
    <div class="grid">
      <div class="pkg"><div class="n">INDIVIDUAL</div><div class="p">$10</div><div class="q">1 qui · +1 GRATIS 2x1</div></div>
      <div class="pkg"><div class="n">AMIGOS</div><div class="p">$15</div><div class="q">2 qui</div></div>
      <div class="pkg"><div class="n">FAMILIA</div><div class="p">$30</div><div class="q">5 qui</div></div>
    </div>
  </div>

  <div class="bottom">
    <div class="cta">INSCRIBETE - CIERRA 11 JUN 5PM</div>
    <div class="url">quinielapanas.com</div>
    <div class="small">📱 Pago Movil · Zelle · Binance Pay</div>
  </div>
</div>
</body>
</html>
